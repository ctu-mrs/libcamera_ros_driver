libcamera_ros_driver:

  ## --------------------------------------------------------------
  ## |                    compulsory parameters                   #
  ## --------------------------------------------------------------

  # Camera name is the key used to identify the camera based on it's device tree path.
  # To get a list of available cameras, run `libcamera-hello --list-cameras`. You will see something like this:
  #   /base/axi/pcie@1000120000/rp1/i2c@80000/ov9281@60
  #   /base/axi/pcie@1000120000/rp1/i2c@88000/ov9281@60
  # You can use any part of the camera's device tree path as the camera_name, as long as it is unique among all cameras on the system.
  #   if you only have one camera, you can leave this as empty string (""), so it matches the first camera found.
  #   if you have different camera models, then the model name is a good choice (such as ov9281)
  #   if you have multiple cameras of the same type, then you can use the address (such as i2c@80000)
  #   if you want to be really sure to use a specific camera, you can use the full device tree path (such as /base/axi/pcie@1000120000/rp1/i2c@80000/ov9281@60)
  camera_name: ""

  stream_role: "still" # [raw, still, video, viewfinder]

  # Available output formats (camera-offered AND driver-supported) with per-pixel cost.
  # Fewer bytes/pixel => less CPU on the per-frame copy and less bandwidth on the wire.
  # NOTE: ov9281 is a 10-bit MONO sensor. On the Pi5/PiSP pipeline, R8 is silently
  #       promoted to R16 (10-bit sensor data unpacked into 16-bit). See "Stream
  #       configuration adjusted" in the startup log to confirm what was negotiated.
  # docs: https://libcamera.org/api-html/build_2include_2libcamera_2formats_8h_source.html
  pixel_format: "RGB888"    # 3 B/px -> BGR8 ; ISP gamma-corrected, display-ready, highest CPU
  # pixel_format: "BGR888"    # 3 B/px -> RGB8 ; ISP gamma-corrected, display-ready
  # pixel_format: "YUYV"      # 2 B/px -> YUV422 ; Y plane is gamma-corrected 8-bit gray (display-ready, low CPU)
  # pixel_format: "R16"       # 2 B/px -> MONO16 ; LINEAR 10-bit data (looks dark in MONO16 viewers; ideal for algorithms)
  # pixel_format: "R8"        # 1 B/px -> MONO8 ; lowest CPU, but PiSP promotes it to R16 on this sensor
  # pixel_format: "XRGB8888"  # 4 B/px -> BGRA8 ; highest CPU
  # pixel_format: "SRGGB8"    # 1 B/px -> raw Bayer8  (not meaningful on a mono sensor)
  # pixel_format: "SRGGB16"   # 2 B/px -> raw Bayer16 (not meaningful on a mono sensor)

  resolution:
    width: 1280
    height: 800

  use_ros_time: true # if set to true, the time stamps of the output camera images will be expressed in the current ROS time, rather than the time given by the camera sensor

  # Narrow a MONO16 source (R16) down to MONO8 in the driver, BEFORE publishing. Halves the
  # serialized payload / wire bandwidth / subscriber copy -- the only byte reduction possible
  # on this sensor, since mono is forced to raw R16 by the pipeline (R8 is promoted, see above).
  # Only takes effect when the negotiated encoding is mono16 (otherwise ignored with a warning).
  # Lossy: drops the low bits the 8-bit consumer ignores anyway (fine for VIO/feature tracking).
  publish_mono8: true
  mono8_shift: 8 # bits to shift right when narrowing.
                 # Image too dark/bright? This is the knob (no rebuild needed).

  # dmabuf cache invalidate/flush around each frame's CPU read. Required for correct reads of
  # NON-coherent capture buffers. If the Pi's buffers are coherent, this is pure CPU overhead
  # (cache ops over the whole frame, every frame). Set false to measure the saving on-device --
  # but ONLY keep it false if the images stay intact (no torn/stale frames, no artifacts).
  dmabuf_sync: true

  # frame_id and calib_url parameters are set using launch file

  ## --------------------------------------------------------------
  ## |                     optional parameters                    #
  ## --------------------------------------------------------------

  # documentation: https://docs.libcamera.org/master/public-api/namespacelibcamera_1_1controls.html
  control:
    fps: 20 # [Hz] Note: fps is set as 1000000/frame_duration_limits
    ae_constraint_mode: "normal" # [normal, highlight, shadows, custom]
    ae_enable: true
    ae_exposure_mode: "normal" # [normal, short, long, custom]
    ae_metering_mode: "centre-weighted" # [centre-weighted, spot, matrix, custom]
    analogue_gain: 1.0 # Analogue gain value applied in the sensor device. The value of the control specifies the gain multiplier applied to all colour channels. This value cannot be lower than 1.0.
    awb_enable: true
    awb_mode: "auto" # [auto, incandescent, tungsten, fluorescent, indoor, daylight, cloudy, custom]
    brightness: 0.0 # Positive values (up to 1.0) produce brighter images; negative values (up to -1.0) produce darker images and 0.0 leaves pixels unchanged.
    contrast: 1.0 # Specify a fixed contrast parameter. Normal contrast is given by the value 1.0; larger values produce images with more contrast.
    exposure_time: 20 # Exposure time (shutter speed) for the frame applied in the sensor device. This value is specified in micro-seconds.
    saturation: 1.0 # Specify a fixed saturation parameter. Normal saturation is given by the value 1.0; larger values produce more saturated colours; 0.0 produces a greyscale image.
    sharpness: 1.0 # A value of 0.0 means no sharpening. The minimum value means minimal sharpening, and shall be 0.0 unless the camera can't disable sharpening completely. The default value shall give a "reasonable" level of sharpening, suitable for most use cases. The maximum value may apply extremely high levels of sharpening, higher than anyone could reasonably want. Negative values are not allowed. Note also that sharpening is not applied to raw streams.
    exposure_value: 0.0 # Specify an Exposure Value (EV) parameter. The EV parameter will only be applied if the AE algorithm is currently enabled.
    scaler_crop: [] # Sets the image portion that will be scaled to form the whole of the final output image. (example of usage: [0, 0, 1456, 1088] is [(0, 0)/1456x1088])
